overview: |
  We propose **Plasma**, a **P**latform for **L**ayout-**A**ware **S**earch and **M**emory **A**rrangement: a unified evaluation framework for graph-based Approximate Nearest Neighbor Search (ANNS) on GPU that isolates the effects of graph index topology and memory layout.
  Graph-based ANNS is essential in modern AI applications such as RAG, and GPU utilization is attracting attention for datasets of millions or more vectors.
  Our framework extracts the topology of arbitrary graph-based indices and enables execution under a unified, GPU-optimized search algorithm, specifying the correspondence between vertex IDs and positions on memory to allow arbitrary vertex orderings.
  Through comprehensive experiments, we demonstrate that vertex reordering yields up to 80% (typically 10–30%) QPS improvement while preserving search accuracy.

body:
  - title: Why Memory Layout Matters on GPU
    text: |
      GPUs have a hierarchical memory system: global memory (DRAM) provides large capacity but high latency, while L1/L2 caches and shared memory offer low latency with limited capacity.
      GPUs execute instructions in groups of 32 threads called warps. When threads in a warp access consecutive global-memory addresses, the hardware combines them into fewer transactions, a pattern known as **coalesced access**. Because graph traversal involves irregular access patterns, coalescing efficiency and cache utilization in global memory can dominate overall search throughput.

      <div class="uk-child-width-1-2@m uk-grid-small uk-flex-middle" uk-grid>
        <div>
          <img src="method.png" class="uk-align-center" style="max-width: 70%" alt="GPU memory hierarchy" />
          <span class="uk-text-meta">Figure 2: GPU Memory Hierarchy. Global memory provides high capacity but low bandwidth. L1 cache and shared memory offer high bandwidth with limited capacity.</span>
        </div>
        <div>
          <img src="method2.png" class="uk-align-center uk-responsive-width" alt="Coalesced memory access" />
          <span class="uk-text-meta">Figure 3: Coalesced Memory Access. (a) The ideal pattern, where threads access consecutive memory addresses. (b) The anti pattern, with scattered memory requests.</span>
        </div>
      </div>
  - title: 🎇 Plasma
    text: |
      Plasma has three components. The **graph adapter** takes an index in any format (Faiss, DiskANN) and converts its topology into a common GPU format, so even a CPU-oriented index runs on GPU. The **reordering module** applies a permutation $\pi$ to vertex IDs. The **unified traversal engine** runs one beam-search kernel for every condition, so a performance difference reflects topology or layout, never the search implementation.

      Vertex IDs index the underlying arrays directly, so reordering is what physically moves data: the dataset region stores $N$ vectors of $d + p$ elements each, the graph region $N$ neighbor lists of up to $K$ IDs. Giving co-accessed vertices consecutive IDs promotes coalesced access and cuts DRAM traffic. Plasma supports GOrder, RCM, Degree Sort, and Hub Sort as $\pi$.

      <div class="uk-child-width-1-2@m uk-grid-small uk-flex-middle" uk-grid>
        <div>
          <img src="method3.png" class="uk-align-center uk-responsive-width" alt="Dataset memory region" />
          <span class="uk-text-meta">Figure 4 (a): The dataset memory region consists of vectors, each containing <i>d</i> data elements plus padding <i>p</i> to satisfy 16-byte alignment.</span>
        </div>
        <div>
          <img src="method4.png" class="uk-align-center uk-responsive-width" alt="Graph memory region" />
          <span class="uk-text-meta">Figure 4 (b): The graph memory region consists of nodes, where each node stores the IDs of up to <i>K</i> neighbor nodes without padding.</span>
        </div>
      </div>

      #### Comparison with existing ANNS benchmarks
      Other ANNS benchmarks compare libraries end to end, so a win can come from the graph, the search algorithm, or the implementation, and none of them can say which. Plasma fixes the kernel and varies only topology and layout, reads GPU hardware counters alongside Recall and QPS, and pins the whole CUDA stack in a [pixi](https://pixi.sh/) lockfile, so `pixi install` reproduces the environment exactly.

      <div class="uk-overflow-auto">
        <table class="uk-table uk-table-small uk-text-small uk-table-divider">
          <thead>
            <tr><th></th><th>ANN-Benchmarks</th><th>BigANN</th><th>VDBBench</th><th>VIBE</th><th style="background-color:#F0EEE6"><b>🎇 Plasma</b></th></tr>
          </thead>
          <tbody>
            <tr><td>Platform</td><td>CPU</td><td>CPU</td><td>CPU</td><td>CPU+GPU</td><td style="background-color:#F0EEE6"><b>GPU</b></td></tr>
            <tr><td>Target</td><td>General</td><td>General</td><td>General</td><td>General</td><td style="background-color:#F0EEE6"><b>Graph index</b></td></tr>
            <tr><td>Modern embeddings</td><td class="uk-text-muted">—</td><td>partial</td><td>partial</td><td>✅</td><td style="background-color:#F0EEE6"><b>✅</b></td></tr>
            <tr><td>HW profiling</td><td class="uk-text-muted">—</td><td class="uk-text-muted">—</td><td class="uk-text-muted">—</td><td class="uk-text-muted">—</td><td style="background-color:#F0EEE6"><b>✅</b></td></tr>
            <tr><td>Memory-layout aware</td><td class="uk-text-muted">—</td><td class="uk-text-muted">—</td><td class="uk-text-muted">—</td><td class="uk-text-muted">—</td><td style="background-color:#F0EEE6"><b>✅</b></td></tr>
            <tr><td>Reproducible env.</td><td>🐳 docker</td><td>🐳 docker</td><td>🐳 docker</td><td>📦 apptainer</td><td style="background-color:#F0EEE6"><b>🪄 pixi</b></td></tr>
          </tbody>
        </table>
      </div>
      <span class="uk-text-meta">Table 1: A dash marks an axis the benchmark does not target. HW profiling is built-in hardware-counter collection (DRAM bandwidth, L1/L2 hit rates). Memory-layout aware is varying the physical vertex layout independently of topology under a fixed search engine.</span>
  - title: 📊 Benchmark
    component: leaderboard
  - title: Lessons Learned
    text: |
      #### Topology matters less than expected
      Benchmarking CAGRA, NSG, Vamana, and NN-Descent across 12 datasets on a single NVIDIA A100, all under the same kernel and their original vertex ordering, shows that topology differences are often minor. To the best of our knowledge, this is the first work to run CPU-oriented indices such as NSG, Vamana, and NN-Descent on a GPU, and NSG outperforms the GPU-optimized CAGRA by up to 1.2× on C4 5M. Differences are small on classical datasets such as SIFT and Deep, and more pronounced on modern high-dimensional ones such as Wikipedia 10M and BioASQ 10M.

      #### Reordering alone buys up to 80% QPS
      Applying reordering to the same four indices yields up to **80% QPS improvement** while preserving search accuracy, with typical gains of 10–30%. C4 5M improves by 60–80% for every index; BioASQ gains less than 10% except for NN-Descent. GOrder is consistently unstable, dropping sharply in the high-recall region, and no single reordering algorithm wins across the board, so the right choice depends on the workload.

      #### The speedup comes from DRAM bandwidth, not caches
      Profiling with Nsight Compute at $L = 120$ attributes the gain to bandwidth rather than caching. L1 hit rates sit near zero (0.007% to 0.025%) regardless of reordering, and L2 hit rates stay between 8% and 28% and move by less than one percentage point. DRAM bandwidth utilization, in contrast, changes substantially: for NSG on SIFT 1M it rises from 39.4% to 44.2% under Hub Sort, a 4.8 point gain that corresponds to roughly 15% more QPS. The correlation between bandwidth-utilization change and execution-time change is $-0.669$ overall and $-0.965$ for the search kernel alone.

      The effect is architecture-dependent. On the A100 (HBM2e, 2,039 GB/s) improvements reach 80%, whereas on an RTX 6000 Ada (GDDR6, 960 GB/s) they stay below 15%, so reordering pays off most on high-bandwidth-memory GPUs.
